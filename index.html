<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VERSUS">
<title>VERSUS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="safe"></div>
<div id="stage" hidden></div>
<div id="controls" hidden></div>
<button id="pauseBtn" class="hud-btn" hidden aria-label="일시정지">❚❚</button>
<button id="exitBtn" class="hud-btn" hidden aria-label="메뉴로 나가기">⌂</button>

<section id="title" class="screen">
  <div class="title-art">
    <img src="themes/classic/portraits/sword.svg" alt="">
    <h1>VERSUS</h1>
    <img src="themes/classic/portraits/genghis.svg" alt="" class="flip">
  </div>
  <p class="tagline">중세 무사 대전 격투 <small id="version"></small></p>
  <div class="menu">
    <button data-mode="2p">2인 대전</button>
    <button data-mode="easy">컴퓨터 · 쉬움</button>
    <button data-mode="hard">컴퓨터 · 어려움</button>
  </div>
  <p class="hint portrait-only">가로로 돌리면 화면이 더 커집니다</p>
</section>

<section id="setup" class="screen" hidden>
  <header><button class="back" aria-label="뒤로">◀</button><h2>대전 설정</h2><span class="mode-label"></span></header>
  <div class="pick">
    <div class="side" data-player="0"><div class="who"></div><div class="roster"></div><div class="info"></div></div>
    <div class="vs">VS</div>
    <div class="side" data-player="1"><div class="who"></div><div class="roster"></div><div class="info"></div></div>
  </div>
  <div class="maps"></div>
  <footer>
    <button id="winsBtn" class="toggle"></button>
    <button id="timeBtn" class="toggle"></button>
    <button id="soundBtn" class="toggle"></button>
    <button id="startBtn" class="primary">시작</button>
  </footer>
</section>

<section id="pause" class="screen overlay" hidden>
  <h2>일시정지</h2>
  <div class="menu"><button id="resumeBtn">계속하기</button><button id="quitBtn">메뉴로</button></div>
</section>

<section id="confirm" class="screen overlay" hidden>
  <h2>메뉴로 나갈까요?</h2>
  <p class="tagline">진행 중인 대전은 저장되지 않습니다</p>
  <div class="menu"><button id="confirmQuitBtn">나가기</button><button id="cancelQuitBtn">계속하기</button></div>
</section>

<section id="result" class="screen overlay" hidden>
  <h2 id="resultText"></h2>
  <div class="menu"><button id="againBtn">다시 하기</button><button id="menuBtn">메뉴로</button></div>
</section>

<div id="hints" hidden></div>
<div id="loading">불러오는 중…</div>
<div id="fatal" hidden>
  <b>문제가 생겼습니다</b>
  <pre></pre>
  <div><button id="fatalReload">앱 새로 받기</button><button id="fatalClose">닫기</button></div>
</div>
<script>
// Load/boot failures are shown on screen instead of a silent freeze (tablets have no devtools).
(function () {
  var box = document.getElementById('fatal'), pre = box.querySelector('pre');
  window.__fatal = function (msg) { box.hidden = false; pre.textContent += msg + '\n'; };
  addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) window.__fatal('로드 실패: ' + (t.src || t.href));
    else window.__fatal((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  }, true);
  addEventListener('unhandledrejection', function (e) { var r = e.reason; window.__fatal('promise: ' + ((r && (r.stack || r.message)) || r)); });
  setTimeout(function () { if (!window.versus) window.__fatal('15초 안에 시작하지 못했습니다'); }, 15000);
  document.getElementById('fatalClose').onclick = function () { box.hidden = true; };
  // drop the service worker and every cache, then load the app fresh from the server
  document.getElementById('fatalReload').onclick = function () {
    var jobs = [];
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
  };
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
